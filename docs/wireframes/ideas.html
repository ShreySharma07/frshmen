<!doctype html>
<!-- 2026-11-11: layout ideas for four sections (jobs, applications, insights, market), same brand
     (paper, ink, marigold; Instrument Serif and Sans; Geist Mono), three different structures.
     Each borrows patterns, never looks, from products Shrey named:
       ?c=1 Workbench  Linear, Vercel, Raycast
       ?c=2 Briefing   Stripe, Apple
       ?c=3 Pinboard   Arc, Notion, Figma, award sites
     &s=jobs | apps | insights | market. Jobs are real postings (2026-10-06 snapshot). Application,
     insight and market numbers are SAMPLES to show the layout; "Market" does not exist yet. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventra layout ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f2eee4; --raised: #fbf9f4; --surface: #e9e3d6; --line: #d9d3c5; --ink: #121110; --muted: #625d53;
    --gold: #ffb21a; --pass: #276b43; --fail: #b5381f; --link: #1f4fd8;
    --serif: "Instrument Serif", serif; --sans: "Instrument Sans", sans-serif; --mono: "Geist Mono", monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
  .mono { font-family: var(--mono); } .serif { font-family: var(--serif); } .mu { color: var(--muted); }
  .hl { background: var(--gold); padding: 0 .14em; border-radius: 2px; }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--raised); }
  .co { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
  /* The ruler: track = 0 to 8+ years, bar = what the job asks, tick = you. */
  .ruler { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
  .ruler i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--gold); }
  .ruler i.open { background: linear-gradient(90deg, var(--gold) 45%, transparent); }
  .ruler.ns { background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  .ruler b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }

  /* ═════ 1. Workbench: a sidebar, dense grouped rows, a command bar. ═════ */
  .k1 { display: grid; grid-template-columns: 212px 1fr; height: 100vh; }
  .k1 aside { border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
  .k1 .brand { font: 24px/1 var(--serif); padding: 0 8px 18px; }
  .k1 aside a { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; border-radius: 6px; color: var(--muted); font-weight: 500; }
  .k1 aside a.on { background: var(--raised); color: var(--ink); box-shadow: inset 2px 0 var(--gold); }
  .k1 aside .me { margin-top: auto; padding: 10px 8px; border-top: 1px solid var(--line); font-size: 13px; }
  .k1 main { display: flex; flex-direction: column; min-width: 0; }
  .k1 .top { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .k1 .top span { font-weight: 400; color: var(--muted); }
  .k1 .top .seg { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-weight: 500; font-size: 13px; }
  .k1 .seg b { padding: 4px 10px; font-weight: 500; color: var(--muted); } .k1 .seg b.on { background: var(--raised); color: var(--ink); }
  .k1 .body { flex: 1; display: grid; min-height: 0; }
  .k1 .grp { display: flex; gap: 10px; align-items: center; padding: 8px 20px; background: var(--surface); font-size: 12.5px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .k1 .grp span { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
  .k1 .row { display: grid; align-items: center; gap: 14px; padding: 9px 20px; border-bottom: 1px solid var(--line); }
  .k1 .row.sel { background: var(--raised); box-shadow: inset 2px 0 var(--ink); }
  .k1 .cmd { margin: 0 20px 16px; display: flex; gap: 10px; align-items: center; height: 40px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 10px; background: var(--raised); color: var(--muted); box-shadow: 0 6px 20px rgb(18 17 16 / .08); }
  .k1 .cmd kbd { margin-left: auto; }
  .k1 .peek { border-left: 1px solid var(--line); padding: 24px 28px; background: var(--raised); }
  .k1 .peek h2 { font: 30px/1.1 var(--serif); margin: 4px 0 14px; }
  .k1 .peek blockquote { font: 19px/1.4 var(--serif); margin: 16px 0 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
  .dot.half { border-color: var(--gold); background: linear-gradient(90deg, var(--gold) 50%, transparent 50%); }
  .dot.full { border-color: var(--pass); background: var(--pass); } .dot.gold { border-color: var(--gold); background: var(--gold); }
  .meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .meter i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .k1 .stat { padding: 18px 20px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 220px 1fr 120px; gap: 20px; align-items: center; }
  .k1 .stat b { font: 500 13px var(--mono); text-align: right; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 28px; } .spark i { width: 7px; background: var(--ink); border-radius: 1px; opacity: .25; } .spark i.now { background: var(--gold); opacity: 1; }
  .up { color: var(--pass); } .down { color: var(--fail); }

  /* ═════ 2. Briefing: one sentence that answers the page, then the proof. ═════ */
  .k2 { height: 100vh; }
  .k2 header { display: flex; align-items: baseline; gap: 34px; padding: 22px 56px 0; }
  .k2 .brand { font: 26px/1 var(--serif); } .k2 nav { display: flex; gap: 26px; color: var(--muted); font-weight: 500; }
  .k2 nav .on { color: var(--ink); box-shadow: 0 6px 0 -4px var(--gold); } .k2 header .r { margin-left: auto; color: var(--muted); }
  .k2 .wrap { padding: 44px 56px 0; }
  .k2 h1 { font: 60px/1.04 var(--serif); letter-spacing: -.015em; max-width: 19ch; }
  .k2 .sub { margin-top: 14px; color: var(--muted); font-size: 16px; max-width: 60ch; }
  .k2 .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 36px; }
  .k2 .card { background: var(--raised); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px; min-height: 250px; }
  .k2 .card h3 { font: 26px/1.12 var(--serif); } .k2 .card .y { font: 44px/1 var(--serif); margin-top: auto; }
  .k2 .card q { font: 16px/1.4 var(--serif); quotes: "“" "”"; }
  .k2 .more { margin-top: 26px; display: flex; gap: 12px; align-items: center; color: var(--muted); }
  .k2 .btn { background: var(--gold); color: var(--ink); font-weight: 600; padding: 10px 18px; border-radius: 999px; }
  .k2 .flow { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 40px; border-top: 1px solid var(--ink); }
  .k2 .flow > div { padding: 18px 20px 0 0; } .k2 .flow > div + div { padding-left: 20px; border-left: 1px solid var(--line); }
  .k2 .flow .n { font: 72px/1 var(--serif); } .k2 .flow .n.zero { color: var(--line); }
  .k2 .flow li { margin-top: 12px; font-weight: 500; } .k2 .flow li span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .k2 .chart { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; align-items: end; height: 250px; margin-top: 40px; position: relative; border-bottom: 1px solid var(--ink); }
  .k2 .chart .bar { background: var(--ink); border-radius: 6px 6px 0 0; position: relative; } .k2 .chart .bar.now { background: var(--gold); }
  .k2 .chart .bar span { position: absolute; top: -24px; left: 0; right: 0; text-align: center; font: 500 13px var(--mono); }
  .k2 .chart .goal { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--muted); } .k2 .chart .goal em { position: absolute; right: 0; top: -22px; font-style: normal; color: var(--muted); font-size: 13px; }
  .k2 .chart .you { position: absolute; top: -30px; bottom: 0; width: 2px; background: var(--ink); } .k2 .chart .you em { position: absolute; top: -4px; left: 10px; white-space: nowrap; font-style: normal; font-weight: 600; }
  .k2 .axis { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; text-align: center; color: var(--muted); font: 13px var(--mono); margin-top: 10px; }

  /* ═════ 3. Pinboard: the page is a desk; cards are paper; a dock switches sections. ═════ */
  .k3 { height: 100vh; position: relative; background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px); background-size: 24px 24px; }
  .k3 .brand { position: absolute; left: 32px; top: 24px; font: 26px/1 var(--serif); }
  .k3 .views { position: absolute; right: 32px; top: 22px; display: flex; gap: 4px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 4px; font-weight: 500; font-size: 13px; }
  .k3 .views b { padding: 5px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); } .k3 .views b.on { background: var(--ink); color: var(--raised); }
  .k3 .dock { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 6px; background: var(--ink); border-radius: 18px; padding: 7px; box-shadow: 0 14px 40px rgb(18 17 16 / .25); }
  .k3 .dock b { color: #cfc8b8; font-weight: 500; padding: 9px 18px; border-radius: 12px; } .k3 .dock b.on { background: var(--gold); color: var(--ink); font-weight: 600; }
  .k3 .big { position: absolute; left: 32px; top: 74px; font: 104px/.9 var(--serif); letter-spacing: -.02em; }
  .k3 .big small { display: block; font: 16px/1.4 var(--sans); color: var(--muted); letter-spacing: 0; margin-top: 12px; max-width: 34ch; }
  .k3 .cols { position: absolute; left: 32px; right: 32px; top: 78px; bottom: 96px; display: grid; gap: 18px; }
  .k3 .col h3 { font: 40px/1 var(--serif); display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; } .k3 .col h3 span { font: 13px var(--sans); color: var(--muted); }
  .note { background: var(--raised); border-radius: 4px; padding: 14px 16px; box-shadow: 0 1px 0 var(--line), 0 10px 24px rgb(18 17 16 / .07); margin-bottom: 14px; position: relative; }
  .note::before { content: ""; position: absolute; left: 50%; top: -7px; width: 46px; height: 14px; margin-left: -23px; background: rgb(255 178 26 / .7); transform: rotate(-2deg); }
  .note h4 { font: 600 14.5px/1.25 var(--sans); } .note p { font-size: 12.5px; color: var(--muted); margin: 3px 0 10px; }
  .note .tag { display: inline-block; font-size: 12px; font-weight: 600; background: var(--gold); padding: 1px 7px; border-radius: 3px; margin-top: 10px; }
  .k3 .poster { position: absolute; left: 32px; top: 80px; }
  .k3 .poster .n { font: 280px/1 var(--serif); letter-spacing: -.04em; display: inline-block; height: 250px; background: linear-gradient(transparent 52%, var(--gold) 52% 84%, transparent 84%); padding: 0 .06em; }
  .k3 .poster p { font: 34px/1.15 var(--serif); max-width: 15ch; margin-top: 22px; }
  .k3 .cal { position: absolute; right: 32px; top: 100px; width: 610px; }
  .k3 .cal h3 { font: 600 14px var(--sans); margin-bottom: 12px; } .k3 .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .k3 .grid i { aspect-ratio: 1; border-radius: 5px; background: var(--surface); } .k3 .grid i.a { background: #ffd98a; } .k3 .grid i.b { background: var(--gold); } .k3 .grid i.c { background: var(--ink); }
  .k3 .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
  .k3 .facts .note { margin: 0; } .k3 .facts b { font: 40px/1 var(--serif); display: block; }
  .k3 .rank { position: absolute; left: 32px; right: 32px; top: 84px; }
  .k3 .rank li { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--line); font-family: var(--serif); line-height: 1.02; letter-spacing: -.02em; }
  .k3 .rank li span { font: 14px var(--mono); color: var(--muted); width: 28px; letter-spacing: 0; } .k3 .rank li em { margin-left: auto; font: 500 15px var(--sans); font-style: normal; letter-spacing: 0; }
  .k3 .ticker { position: absolute; left: 0; right: 0; bottom: 92px; background: var(--ink); color: var(--raised); white-space: nowrap; overflow: hidden; padding: 9px 0; font: 500 13px var(--mono); }
  .k3 .ticker b { color: var(--gold); font-weight: 500; }
</style>
</head>
<body>
<script>
// Real postings. [title, company, place, posted, min, max(null = open), new]
const J = [
  ["Machine Learning Engineer, Search Quality", "Glean", "San Francisco", "25 Sep", 2, null, 1],
  ["Software Engineer, Public Sector – New Grad", "Scale AI", "San Francisco", "23 Sep", 0, 0, 1],
  ["Software Engineer – New Grad", "Scale AI", "London", "14 Sep", 0, 0, 1],
  ["Machine Learning Research Scientist, Evaluations", "Scale AI", "SF, Seattle, New York", "26 Aug", null],
  ["ML Engineer (Data), Foundational Models", "Sarvam AI", "Bengaluru, onsite", "21 May", 3, null],
  ["ML Ops Engineer, Chanakya", "Sarvam AI", "Delhi, onsite", "17 Apr", 3, 5],
  ["Embedded Data Scientist, Chanakya", "Sarvam AI", "Delhi, onsite", "17 Apr", 2, 5],
  ["Backend Engineer, Chanakya", "Sarvam AI", "Bengaluru, onsite", "17 Apr", 3, 6],
];
const ME = 3, MAX = 8, pct = (n) => Math.min(n, MAX) / MAX * 100;
const yrs = (a, b) => a == null ? "Not stated" : b === null ? a + "+" : a === b ? "" + a : a + "–" + b;
const ruler = (a, b, w = 96) => `<div class="ruler ${a == null ? "ns" : ""}" style="width:${w}px">${a == null ? "" : `<i class="${b === null ? "open" : ""}" style="left:${pct(a)}%;width:${b === null ? 100 - pct(a) : Math.max(pct(b) - pct(a), 6)}%"></i>`}<b style="left:${pct(ME)}%"></b></div>`;
const tint = { "Scale AI": ["#fbe3d8", "#8a3a14"], "Sarvam AI": ["#dcefdc", "#1f5c2e"], "Glean": ["#d9f0e4", "#17603c"] };
const co = (c) => `<span class="co" style="background:${tint[c][0]};color:${tint[c][1]}">${c[0]}</span>`;
// SAMPLE numbers below (applications, insights, market): layout only.
const SKILLS = [["Python", 71, +2], ["PyTorch", 38, +5], ["LLMs", 33, +9], ["SQL", 29, -1], ["Kubernetes", 21, 0], ["FastAPI", 12, +3]];
const ASKED = [356, 410, 890, 1240, 720, 980, 310, 190, 1044]; // open target-role jobs by minimum years asked, 0 to 8+
const WEEKS = [["13 Oct", 2], ["20 Oct", 5], ["27 Oct", 3], ["3 Nov", 7], ["This week", 4]];
const q = new URLSearchParams(location.search), c = q.get("c") || "1", s = q.get("s") || "jobs";
const NAV = [["jobs", "Jobs"], ["apps", "Applications"], ["insights", "Insights"], ["market", "Market"]];

/* ───── 1. Workbench ───── */
const k1 = {
  shell: (title, sub, seg, body) => `<div class="k1"><aside><div class="brand">aventra</div>
    ${NAV.map(([k, l], i) => `<a class="${k === s ? "on" : ""}">${l}<kbd>G ${l[0]}</kbd></a>`).join("")}
    <div class="me"><b>3 years</b> <span class="mu">of experience</span><br><span class="mu">AI/ML, backend</span></div></aside>
    <main><div class="top">${title} <span>${sub}</span>${seg ? `<div class="seg">${seg.map((x, i) => `<b class="${i ? "" : "on"}">${x}</b>`).join("")}</div>` : ""}</div>
    <div class="body" ${body.cols ? `style="grid-template-columns:${body.cols}"` : ""}>${body.html}</div>
    <div class="cmd">Search jobs, or type a command: “remote in India”, “save”, “applied”<kbd>Ctrl K</kbd></div></main></div>`,
  jobs() {
    const row = (j, sel) => `<div class="row ${sel ? "sel" : ""}" style="grid-template-columns:28px 1fr 60px 96px">${co(j[1])}<div style="min-width:0"><div class="clip" style="font-weight:500">${j[6] ? '<span class="hl" style="font-size:11px;font-weight:600;margin-right:6px">New</span>' : ""}${j[0]}</div><div class="mu clip" style="font-size:12.5px">${j[1]}, ${j[2]}, ${j[3]}</div></div><span class="serif" style="font-size:20px;text-align:right">${j[4] == null ? '<span class="mu" style="font:11px var(--sans)">Not stated</span>' : yrs(j[4], j[5])}</span>${ruler(j[4], j[5])}</div>`;
    const fits = J.filter((j) => j[4] != null && j[4] <= ME && j[4] > 0), fresh = J.filter((j) => j[4] === 0), ns = J.filter((j) => j[4] == null);
    return this.shell("Jobs", "33 open for you", ["Grouped by fit", "Newest", "Company"], { cols: "1fr 430px", html: `<div style="overflow:hidden">
      <div class="grp">Asks for your level <span>2 to 3 years · 21</span></div>${fits.map((j, i) => row(j, i === 1)).join("")}
      <div class="grp">Asks for less than you have <span>0 to 1 years · 8</span></div>${fresh.map((j) => row(j)).join("")}
      <div class="grp">Years not stated <span>read before applying · 4</span></div>${ns.map((j) => row(j)).join("")}</div>
      <div class="peek"><div class="mu">Sarvam AI, Bengaluru, onsite</div><h2>ML Engineer (Data), Foundational Models</h2>${ruler(3, null, 370)}
      <blockquote>“<span class="hl">3+ years of experience</span> building large-scale data systems”</blockquote><div class="mu" style="font-size:13px">The line that decided it. You have 3, so it fits.</div>
      <div style="display:flex;gap:8px;margin-top:22px"><span style="background:var(--gold);padding:8px 14px;border-radius:8px;font-weight:600">Apply <kbd style="background:none;border-color:rgb(18 17 16/.3);color:var(--ink)">A</kbd></span><span style="border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-weight:500">Save <kbd>S</kbd></span></div></div>` });
  },
  apps() {
    const row = (dot, j, next, days) => `<div class="row" style="grid-template-columns:12px 28px 1fr 240px 70px"><span class="dot ${dot}"></span>${co(j[1])}<div style="min-width:0"><div class="clip" style="font-weight:500">${j[0]}</div><div class="mu" style="font-size:12.5px">${j[1]}, ${j[2]}</div></div><span>${next}</span><span class="mono mu" style="font-size:12px;text-align:right">${days}</span></div>`;
    return this.shell("Applications", "11 in progress", ["By stage", "By date"], { html: `<div>
      <div style="display:flex;gap:3px;padding:14px 20px"><i style="flex:6;height:8px;border-radius:4px;background:var(--line)"></i><i style="flex:4;height:8px;border-radius:4px;background:#ffd98a"></i><i style="flex:1;height:8px;border-radius:4px;background:var(--gold)"></i></div>
      <div class="grp">Interview <span>1</span></div>${row("gold", J[1], "<b>Round 2 on Thursday.</b> Prepare", "3 d")}
      <div class="grp">Applied <span>4</span></div>${row("half", J[4], "No reply yet. Follow up on Friday", "6 d")}${row("half", J[7], "Sent with tailored resume", "2 d")}${row("half", J[5], "Sent", "2 d")}
      <div class="grp">Saved <span>6</span></div>${row("", J[0], "Closes soon. Apply or drop", "9 d")}${row("", J[2], "Check my fit first", "1 d")}${row("", J[6], "Asks 2 to 5 years. Fits", "1 d")}</div>` });
  },
  insights() {
    const st = (l, d, w, v) => `<div class="stat"><div><div style="font-weight:600">${l}</div><div class="mu" style="font-size:12.5px">${d}</div></div>${w}<b>${v}</b></div>`;
    return this.shell("Insights", "this week against your goal", ["Week", "Month", "All"], { html: `<div>
      ${st("Applications sent", "Goal: 10 a week", `<div class="meter"><i style="width:40%"></i></div>`, "4 / 10")}
      ${st("Last five weeks", "Applications per week", `<div class="spark">${WEEKS.map(([, n], i) => `<i class="${i === 4 ? "now" : ""}" style="height:${n * 4}px"></i>`).join("")}</div>`, "avg 4.2")}
      ${st("Replies", "Of 14 sent in the last 30 days", `<div class="meter"><i style="width:21%"></i></div>`, "3 / 14")}
      ${st("Jobs that fit, opened", "New jobs for 3 years since Monday", `<div class="meter"><i style="width:58%"></i></div>`, "7 / 12")}
      ${st("Skills you are missing most", "Across the jobs you saved", `<div style="display:flex;gap:6px"><span class="hl">Kubernetes</span><span class="hl">Spark</span><span class="hl">SQL</span></div>`, "3 skills")}</div>` });
  },
  market() {
    return this.shell("Market", "6,140 open jobs in your roles", ["Skills", "Years", "Cities"], { cols: "1fr 1fr", html: `<div style="border-right:1px solid var(--line)">
      <div class="grp">Skills asked for most <span>share of jobs · change in 30 days</span></div>
      ${SKILLS.map(([n, p, d], i) => `<div class="row" style="grid-template-columns:20px 110px 1fr 44px 50px"><span class="mono mu" style="font-size:12px">${i + 1}</span><b style="font-weight:500">${n}</b><div class="meter"><i style="width:${p}%"></i></div><span class="mono" style="font-size:12.5px;text-align:right">${p}%</span><span class="mono ${d > 0 ? "up" : d < 0 ? "down" : "mu"}" style="font-size:12.5px;text-align:right">${d > 0 ? "+" : ""}${d}</span></div>`).join("")}</div>
      <div><div class="grp">Years asked for <span>the ruler, for every job at once</span></div>
      <div style="padding:26px 24px"><div style="display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:200px">${ASKED.map((n, i) => `<i style="height:${n / 1240 * 100}%;background:${i <= ME ? "var(--gold)" : "var(--line)"};border-radius:4px 4px 0 0"></i>`).join("")}</div>
      <div class="mono mu" style="display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;text-align:center;font-size:12px;margin-top:8px">${ASKED.map((_, i) => `<span>${i === 8 ? "8+" : i}</span>`).join("")}</div>
      <p style="margin-top:18px"><b>2,896 of 6,140</b> jobs ask for 3 years or fewer. <span class="mu">Those are the gold bars.</span></p></div></div>` });
  },
};

/* ───── 2. Briefing ───── */
const k2 = {
  shell: (h1, sub, body) => `<div class="k2"><header><span class="brand">aventra</span><nav>${NAV.map(([k, l]) => `<span class="${k === s ? "on" : ""}">${l}</span>`).join("")}</nav><span class="r">Search &nbsp; 3 years</span></header><div class="wrap"><h1>${h1}</h1><p class="sub">${sub}</p>${body}</div></div>`,
  jobs() {
    const pick = [J[4], J[0], J[6]], ev = ["3+ years of experience building large-scale data systems", "2+ years of industry experience building ML systems", "2–5 years of applied data science experience"];
    return this.shell(`<span class="hl">12 new jobs</span> fit your 3 years since Monday.`, "33 are open in all. These three are the closest to what you have done.", `<div class="cards">${pick.map((j, i) => `<div class="card"><div style="display:flex;gap:10px;align-items:center">${co(j[1])}<span class="mu">${j[1]}, ${j[2]}</span></div><h3>${j[0]}</h3><q>${ev[i]}</q><div class="y">${yrs(j[4], j[5])} <span style="font:14px var(--sans);color:var(--muted)">years</span></div>${ruler(j[4], j[5], 300)}</div>`).join("")}</div>
      <div class="more"><span class="btn">See all 33</span> or narrow: AI/ML, Backend, Remote, India</div>`);
  },
  apps() {
    const col = (n, l, items) => `<div><div class="n ${n ? "" : "zero"}">${n}</div><b>${l}</b><ul>${items.map(([t, d]) => `<li>${t}<span>${d}</span></li>`).join("")}</ul></div>`;
    return this.shell(`One interview this week. <span class="hl">Round 2 is on Thursday.</span>`, "Scale AI, Software Engineer, Public Sector. Everything else can wait until Friday.", `<div class="flow">
      ${col(6, "Saved", [["ML Engineer, Search Quality", "Glean. Closes soon"], ["Software Engineer – New Grad", "Scale AI, London"], ["and 4 more", ""]])}
      ${col(4, "Applied", [["ML Engineer (Data)", "Sarvam AI. 6 days, no reply"], ["Backend Engineer, Chanakya", "Sarvam AI. 2 days"], ["and 2 more", ""]])}
      ${col(1, "Interview", [["Software Engineer, Public Sector", "Scale AI. Thursday"]])}
      ${col(0, "Offer", [])}</div>`);
  },
  insights() {
    return this.shell(`You sent 4 applications this week. <span class="hl">Six to go.</span>`, "Your goal is 10 a week. Last week you sent 7, your best so far.", `<div class="chart"><div class="goal" style="bottom:100%"><em>Goal: 10</em></div>${WEEKS.map(([, n], i) => `<div class="bar ${i === 4 ? "now" : ""}" style="height:${n * 10}%"><span>${n}</span></div>`).join("")}</div><div class="axis">${WEEKS.map(([w]) => `<span>${w}</span>`).join("")}</div>`);
  },
  market() {
    return this.shell(`Nearly half of the market is <span class="hl">open to you.</span>`, "2,896 of 6,140 open jobs in your roles ask for 3 years or fewer. Each bar is the number of jobs asking for that many years.", `<div class="chart" style="height:230px">${ASKED.map((n, i) => `<div class="bar ${i <= ME ? "now" : ""}" style="height:${n / 1240 * 100}%;${i > ME ? "background:var(--line)" : ""}"><span>${n.toLocaleString("en")}</span></div>`).join("")}<div class="you" style="left:calc(${4 / 9 * 100}% - 7px)"><em>You: 3 years</em></div></div><div class="axis">${ASKED.map((_, i) => `<span>${i === 8 ? "8+" : i} yrs</span>`).join("")}</div>`);
  },
};

/* ───── 3. Pinboard ───── */
const k3 = {
  shell: (views, body, on = 1) => `<div class="k3"><span class="brand">aventra</span>${views ? `<div class="views">${views.map((v, i) => `<b class="${i === on ? "on" : ""}">${v}</b>`).join("")}</div>` : ""}${body}<div class="dock">${NAV.map(([k, l]) => `<b class="${k === s ? "on" : ""}">${l}</b>`).join("")}</div></div>`,
  note: (j, extra = "", rot = 0) => `<div class="note" style="transform:rotate(${rot}deg)"><h4>${j[0]}</h4><p>${j[1]}, ${j[2]}</p>${ruler(j[4], j[5], 150)}${extra}</div>`,
  jobs() {
    const cols = [["0", "freshers", [J[1], J[2]]], ["2", "years", [J[0], J[6]]], ["3", "years: you", [J[4], J[5], J[7]]], ["?", "not stated", [J[3]]]];
    return this.shell(["List", "Board by years", "Map"], `<div class="cols" style="grid-template-columns:repeat(4,1fr)">${cols.map(([n, l, js], ci) => `<div class="col"><h3>${ci === 2 ? `<span class="hl" style="font:inherit;color:var(--ink)">${n}</span>` : n}<span>${l}</span></h3>${js.map((j, i) => this.note(j, j[6] ? '<span class="tag">New</span>' : "", [-.6, .5, -.3][i])).join("")}</div>`).join("")}</div>`);
  },
  apps() {
    const cols = [["Saved", 6, [[J[0], "Closes soon"], [J[2], "Check fit first"]]], ["Applied", 4, [[J[4], "6 days, no reply"], [J[7], "2 days"]]], ["Interview", 1, [[J[1], "Round 2, Thursday"]]], ["Offer", 0, []]];
    return this.shell(["List", "Board", "Calendar"], `<div class="cols" style="grid-template-columns:repeat(4,1fr)">${cols.map(([l, n, js]) => `<div class="col"><h3>${l}<span>${n}</span></h3>${js.map(([j, t], i) => this.note(j, `<span class="tag">${t}</span>`, [.7, -.5][i])).join("")}${js.length ? "" : `<div style="border:2px dashed var(--line);border-radius:6px;height:120px;display:grid;place-items:center;color:var(--muted)">Drag a job here</div>`}</div>`).join("")}</div>`);
  },
  insights() {
    const days = Array.from({ length: 84 }, (_, i) => ["", "", "a", "", "b", "", "", "a", "c", "", "b", "a"][(i * 7 + (i >> 3)) % 12]);
    return this.shell(null, `<div class="poster"><span class="n">4</span><p>applications this week. Six more reach your goal.</p></div>
      <div class="cal"><h3>Your last 12 weeks, one square a day</h3><div class="grid">${days.map((d) => `<i class="${d}"></i>`).join("")}</div>
      <div class="facts"><div class="note"><b>7</b>best week, 3 Nov</div><div class="note"><b>3</b>replies from 14 sent</div><div class="note"><b>5</b>weeks in a row</div></div></div>`);
  },
  market() {
    return this.shell(["Skills", "Years", "Cities"].slice(0, 3), `<ol class="rank">${SKILLS.slice(0, 5).map(([n, p, d], i) => `<li style="font-size:${[112, 88, 76, 60, 48][i]}px"><span>${i + 1}</span>${i === 2 ? `<span class="hl" style="font:inherit;color:var(--ink);width:auto;letter-spacing:inherit">${n}</span>` : n}<em>${p}% of jobs <span class="${d > 0 ? "up" : d < 0 ? "down" : "mu"}" style="font:500 13px var(--mono);width:auto">${d > 0 ? "+" : ""}${d}</span></em></li>`).join("")}</ol>
      <div class="ticker">${Array(3).fill(`&nbsp; LLMs <b>+9</b> &nbsp;·&nbsp; PyTorch <b>+5</b> &nbsp;·&nbsp; FastAPI <b>+3</b> &nbsp;·&nbsp; Python <b>+2</b> &nbsp;·&nbsp; Kubernetes 0 &nbsp;·&nbsp; SQL −1 &nbsp;·&nbsp; Bengaluru 2,140 jobs &nbsp;·&nbsp; Remote 610 jobs &nbsp;·`).join("")}</div>`, 0);
  },
};
document.body.innerHTML = ({ 1: k1, 2: k2, 3: k3 }[c])[s]();
</script>
</body>
</html>
