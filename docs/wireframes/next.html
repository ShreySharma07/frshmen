<!doctype html>
<!-- 2026-11-11: the app pages (job list first) in three directions, for Shrey to choose from before
     any real styling. Open with ?d=a (Ledger), ?d=b (Console) or ?d=c (Billboard). Same real jobs
     in each; layout, type and the one signature idea differ. All three keep the landing page's
     ink, paper and marigold so the app and the landing read as one product. Values are not final. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventra directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  body { -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 899px) { .wrap { padding: 0 16px; } .wide { display: none !important; } }
  @media (min-width: 900px) { .narrow { display: none !important; } }

  /* ───────── A. Ledger: paper, serif, and a highlighter on the line that decided the label ───────── */
  body[data-d="a"] { background: #F2EEE4; color: #121110; font: 15px/1.5 "Instrument Sans", sans-serif; }
  .a header { display: flex; align-items: baseline; gap: 28px; padding: 22px 0 18px; border-bottom: 1px solid #121110; }
  .a .brand { font: 30px/1 "Instrument Serif", serif; }
  .a nav { display: flex; gap: 22px; color: #6B655A; }
  .a nav .on { color: #121110; text-decoration: underline; text-underline-offset: 6px; }
  .a .find { margin-left: auto; color: #6B655A; }
  .a .sentence { font: 38px/1.2 "Instrument Serif", serif; padding: 36px 0 30px; max-width: 26ch; letter-spacing: -.01em; }
  .a .sentence u { text-decoration-thickness: 1px; text-underline-offset: 7px; text-decoration-color: #B9B1A0; }
  .a .sentence small { display: block; font: 14px/1.5 "Instrument Sans", sans-serif; color: #6B655A; margin-top: 12px; letter-spacing: 0; }
  .a .split { display: grid; grid-template-columns: 460px 1fr; gap: 48px; align-items: start; padding-bottom: 40px; }
  .a .list li { display: grid; grid-template-columns: 64px 1fr auto; gap: 0 12px; align-items: baseline; padding: 14px 0; border-top: 1px solid #D8D1C2; }
  .a .list li.sel { border-top-color: #121110; }
  .a .y { font: 30px/1 "Instrument Serif", serif; }
  .a .y.ns { font: 13px "Instrument Sans", sans-serif; color: #6B655A; }
  .a .t { font-weight: 600; }
  .a .list li.sel .t span { background: linear-gradient(transparent 55%, #FFB21A 55%); }
  .a .s, .a .when { font-size: 13.5px; color: #6B655A; }
  .a .new { color: #B5381F; font-weight: 600; }
  .a .detail { background: #FBF9F4; padding: 40px 44px 44px; position: sticky; top: 16px; }
  .a .co { color: #6B655A; }
  .a h2 { font: 400 46px/1.05 "Instrument Serif", serif; letter-spacing: -.015em; margin: 6px 0 14px; max-width: 16ch; }
  .a .facts { color: #6B655A; font-size: 14px; }
  .a blockquote { font: 26px/1.4 "Instrument Serif", serif; margin: 34px 0 10px; max-width: 30ch; }
  .a mark { background: #FFB21A; color: inherit; padding: 0 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .a .cap { font-size: 13.5px; color: #6B655A; max-width: 52ch; }
  .a .acts { display: flex; gap: 10px; margin-top: 32px; }
  .a .apply { background: #121110; color: #FBF9F4; padding: 12px 20px; font-weight: 600; border-radius: 2px; }
  .a .sec { padding: 12px 16px; border: 1px solid #121110; border-radius: 2px; font-weight: 500; }
  @media (max-width: 899px) {
    .a .sentence { font-size: 28px; padding: 24px 0 20px; } .a .split { display: block; }
    .a .list li { grid-template-columns: 52px 1fr; } .a .y { font-size: 26px; }
    .a .list li.sel .t span { background: none; } .a .list li.sel { border-top-color: #D8D1C2; }
  }

  /* ───────── B. Console: dark, dense, and a ruler that shows where your years fall ───────── */
  body[data-d="b"] { background: #14130F; color: #EDE9DF; font: 14px/1.45 "Geist", sans-serif; }
  .b header { display: flex; align-items: center; gap: 20px; height: 52px; border-bottom: 1px solid #2B2922; padding: 0 20px; }
  .b .brand { font: 22px/1 "Instrument Serif", serif; }
  .b .cmd { flex: 1; max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #2B2922; border-radius: 6px; background: #1B1A15; color: #9A9486; font-size: 13px; }
  .b kbd { margin-left: auto; font: 11px "Geist Mono", monospace; border: 1px solid #3A372E; border-radius: 4px; padding: 1px 5px; }
  .b .me { color: #9A9486; font-size: 13px; }
  .b .cols { display: grid; grid-template-columns: 208px 468px 1fr; min-height: calc(100vh - 52px); }
  .b .rail { border-right: 1px solid #2B2922; padding: 18px 16px; font-size: 13px; }
  .b .rail h3 { font: 500 12px "Geist", sans-serif; color: #9A9486; margin: 18px 0 6px; }
  .b .rail h3:first-child { margin-top: 0; }
  .b .rail li { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 5px; color: #C9C3B5; }
  .b .rail li.on { background: #24221B; color: #EDE9DF; box-shadow: inset 2px 0 #FFB21A; }
  .b .rail li i { font: 12px "Geist Mono", monospace; color: #7C7668; font-style: normal; }
  .b .list { border-right: 1px solid #2B2922; }
  .b .lhead { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 12.5px; color: #9A9486; border-bottom: 1px solid #2B2922; }
  .b .list li { display: grid; grid-template-columns: 1fr 132px; gap: 14px; align-items: center; padding: 11px 16px; border-bottom: 1px solid #211F19; }
  .b .list li.sel { background: #1F1D17; box-shadow: inset 2px 0 #FFB21A; }
  .b .t { font-weight: 500; } .b .s { font-size: 12.5px; color: #9A9486; }
  .b .new { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #FFB21A; margin-right: 7px; vertical-align: 2px; }
  /* The ruler: track = 0 to 8+ years, bar = what the job asks, tick = your years. */
  .ruler { position: relative; height: 8px; border-radius: 4px; background: #2B2922; }
  .ruler .ask { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: #FFB21A; }
  .ruler .ask.open { border-radius: 4px 0 0 4px; background: linear-gradient(90deg, #FFB21A 40%, rgb(255 178 26 / 0)); }
  .ruler.ns { background: repeating-linear-gradient(90deg, #3A372E 0 4px, transparent 4px 8px); }
  .ruler .you { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #EDE9DF; }
  .b .rl { font: 12px "Geist Mono", monospace; color: #C9C3B5; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .b .rl em { font-style: normal; color: #3FA66A; } .b .rl em.ns { color: #7C7668; }
  .b .detail { padding: 32px 40px; max-width: 620px; }
  .b .co { color: #9A9486; }
  .b h2 { font: 600 28px/1.15 "Geist", sans-serif; letter-spacing: -.025em; margin: 4px 0 10px; }
  .b .facts { color: #9A9486; font-size: 13px; }
  .b .big { margin: 30px 0 8px; }
  .b .big .ruler { height: 14px; border-radius: 7px; } .b .big .ask { border-radius: 7px 0 0 7px; }
  .b .big .you { top: -8px; bottom: -8px; }
  .b .scale { display: flex; justify-content: space-between; font: 11.5px "Geist Mono", monospace; color: #7C7668; margin-top: 10px; }
  .b .verdict { margin-top: 14px; font-size: 14.5px; } .b .verdict b { color: #3FA66A; font-weight: 500; }
  .b .src { margin-top: 26px; border: 1px solid #2B2922; border-radius: 8px; overflow: hidden; font: 13px/1.7 "Geist Mono", monospace; }
  .b .src div { display: grid; grid-template-columns: 44px 1fr; color: #7C7668; }
  .b .src div span:first-child { text-align: right; padding-right: 12px; color: #4F4B40; }
  .b .src div.hit { background: rgb(255 178 26 / .1); color: #EDE9DF; box-shadow: inset 2px 0 #FFB21A; }
  .b .src p { padding: 8px 14px; font: 12px "Geist", sans-serif; color: #9A9486; border-top: 1px solid #2B2922; }
  .b .acts { display: flex; gap: 8px; margin-top: 26px; }
  .b .apply { background: #FFB21A; color: #14130F; height: 36px; padding: 0 16px; border-radius: 6px; font-weight: 600; }
  .b .sec { height: 36px; padding: 0 14px; border: 1px solid #3A372E; border-radius: 6px; }
  .b .sec kbd { margin-left: 8px; }
  @media (max-width: 899px) {
    .b header { padding: 0 16px; } .b .cols { display: block; } .b .list { border: 0; }
    .b .list li { grid-template-columns: 1fr 96px; } .b .list li.sel { background: none; box-shadow: none; }
  }

  /* ───────── C. Billboard: the years are the headline; a row opens in place ───────── */
  body[data-d="c"] { background: #FBF9F4; color: #121110; font: 15px/1.45 "Archivo", sans-serif; }
  .c header { display: flex; align-items: center; gap: 24px; padding: 18px 0; }
  .c .brand { font: 26px/1 "Instrument Serif", serif; }
  .c nav { display: flex; gap: 20px; font-weight: 500; color: #6B655A; } .c nav .on { color: #121110; }
  .c .find { margin-left: auto; font-weight: 500; }
  .c .dial { display: flex; align-items: baseline; gap: 20px; padding: 28px 0 8px; font: 800 64px/1 "Archivo", sans-serif; font-stretch: 62%; letter-spacing: -.01em; }
  .c .dial ol { display: flex; gap: 6px; }
  .c .dial li { min-width: 72px; padding: 6px 10px 2px; text-align: center; color: #C9C1B0; border-radius: 6px; }
  .c .dial li.on { background: #121110; color: #FFB21A; }
  .c .sub { color: #6B655A; padding-bottom: 22px; font-weight: 500; }
  .c .sub b { color: #121110; font-weight: 700; }
  .c .list { border-top: 3px solid #121110; margin-bottom: 40px; }
  .c .list li { display: grid; grid-template-columns: 150px 1fr 240px 90px; gap: 0 20px; align-items: center; padding: 14px 0 10px; border-bottom: 1px solid #D8D1C2; }
  .c .y { font: 800 68px/.9 "Archivo", sans-serif; font-stretch: 62%; }
  .c .y sup { font-size: 22px; font-stretch: 80%; font-weight: 600; vertical-align: 26px; margin-left: 6px; }
  .c .y.ns { font: 600 15px/1.3 "Archivo", sans-serif; color: #6B655A; font-stretch: 100%; }
  .c .t { font: 700 21px/1.2 "Archivo", sans-serif; font-stretch: 88%; letter-spacing: -.01em; }
  .c .s { color: #6B655A; font-weight: 500; }
  .c .when { text-align: right; color: #6B655A; font-weight: 500; }
  .c .new { background: #121110; color: #FBF9F4; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 3px; margin-left: 8px; vertical-align: 3px; }
  .c .list li.sel { background: #FFB21A; margin: 0 -24px; padding: 26px 24px 30px; border-bottom-color: #121110; align-items: start; grid-template-rows: auto auto; }
  .c .list li.sel .y { font-size: 124px; } .c .list li.sel .y sup { font-size: 30px; vertical-align: 62px; }
  .c .list li.sel .t { font-size: 34px; line-height: 1.05; }
  .c .list li.sel .s, .c .list li.sel .when { color: #121110; }
  .c .open { grid-column: 2 / -1; margin-top: 18px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
  .c .open blockquote { font: 500 20px/1.4 "Archivo", sans-serif; max-width: 44ch; }
  .c .open blockquote b { font-weight: 800; border-bottom: 3px solid #121110; }
  .c .open p { font-size: 13.5px; font-weight: 500; margin-top: 8px; }
  .c .acts { display: flex; gap: 8px; }
  .c .apply { background: #121110; color: #FBF9F4; padding: 14px 22px; border-radius: 6px; font-weight: 700; }
  .c .sec { padding: 14px 18px; border: 2px solid #121110; border-radius: 6px; font-weight: 700; }
  @media (max-width: 899px) {
    .c .dial { font-size: 40px; gap: 10px; flex-direction: column; padding-top: 12px; }
    .c .dial li { min-width: 44px; padding: 4px 6px 0; }
    .c .list li { grid-template-columns: 76px 1fr; } .c .y { font-size: 44px; } .c .y sup { font-size: 15px; vertical-align: 16px; margin-left: 3px; }
    .c .t { font-size: 17px; }
    .c .list li.sel { margin: 0 -16px; padding: 18px 16px 20px; } .c .list li.sel .y { font-size: 60px; } .c .list li.sel .y sup { font-size: 17px; vertical-align: 26px; }
    .c .list li.sel .t { font-size: 22px; }
    .c .open { grid-column: 1 / -1; grid-template-columns: 1fr; } .c .open blockquote { font-size: 17px; }
  }
</style>
</head>
<body>
<script>
// Real postings (pipeline snapshot, 2026-10-06), as seen by someone with 3 years.
// [title, company, where, posted, min years, max years (null = open-ended), new, selected]
const J = [
  ["Machine Learning Engineer, Search Quality", "Glean", "San Francisco", "25 Sep", 2, null, 1],
  ["Software Engineer, Public Sector – New Grad", "Scale AI", "San Francisco", "23 Sep", 0, 0, 1],
  ["Software Engineer – New Grad", "Scale AI", "London", "14 Sep", 0, 0, 1],
  ["Machine Learning Research Scientist, Evaluations", "Scale AI", "SF, Seattle, New York", "26 Aug", null],
  ["ML Engineer (Data), Foundational Models", "Sarvam AI", "Bengaluru, onsite", "21 May", 3, null, 0, 1],
  ["ML Ops Engineer, Chanakya", "Sarvam AI", "Delhi, onsite", "17 Apr", 3, 5],
  ["Embedded Data Scientist, Chanakya", "Sarvam AI", "Delhi, onsite", "17 Apr", 2, 5],
  ["Backend Engineer, Chanakya", "Sarvam AI", "Bengaluru, onsite", "17 Apr", 3, 6],
];
const ME = 3, MAX = 8;
const yrs = (a, b) => a === null ? null : b === null ? a + "+" : a === b ? "" + a : a + "–" + b;
const pct = (n) => (Math.min(n, MAX) / MAX) * 100;
const ruler = (a, b, cls = "") => a === null
  ? `<div class="ruler ns ${cls}"><span class="you" style="left:${pct(ME)}%"></span></div>`
  : `<div class="ruler ${cls}"><span class="ask ${b === null ? "open" : ""}" style="left:${pct(a)}%;width:${b === null ? 100 - pct(a) : Math.max(pct(b) - pct(a), 3)}%"></span><span class="you" style="left:${pct(ME)}%"></span></div>`;
const d = new URLSearchParams(location.search).get("d") || "a";
document.body.dataset.d = d;

const A = () => `<div class="a wrap">
  <header><span class="brand">Aventra</span>
    <nav class="wide"><span class="on">Jobs</span><span>Saved 2</span><span>Applied 1</span><span>Insights</span></nav>
    <span class="find">Search</span></header>
  <h1 class="sentence">Jobs for <u>3 years</u> of experience in <u>AI/ML and backend</u>, <u>anywhere</u>.
    <small>33 open today, newest first. 3 are new since Monday.</small></h1>
  <div class="split">
    <ol class="list">${J.map(([t, c, w, p, a, b, n, sel]) => `<li class="${sel ? "sel" : ""}">
      <span class="y ${a === null ? "ns" : ""}">${yrs(a, b) ?? "Not stated"}</span>
      <div><div class="t"><span>${t}</span></div><div class="s">${n ? '<span class="new">New</span>, ' : ""}${c}, ${w}</div></div>
      <span class="when wide">${p}</span></li>`).join("")}</ol>
    <aside class="detail wide">
      <div class="co">Sarvam AI</div>
      <h2>ML Engineer (Data), Foundational Models</h2>
      <div class="facts">Bengaluru, onsite. Full-time. Posted 21 May.</div>
      <blockquote>“<mark>3+ years of experience</mark> building large-scale data systems: petabyte-scale processing, distributed data pipelines, or comparable.”</blockquote>
      <p class="cap">This line in the job description is why the job is marked 3+ years. You have 3, so it fits.</p>
      <div class="acts"><button class="apply">Apply on Sarvam AI</button><button class="sec">Save</button><button class="sec">Check my fit</button></div>
    </aside>
  </div></div>`;

const B = () => `<div class="b">
  <header><span class="brand">Aventra</span>
    <div class="cmd">3 yrs, AI/ML or backend, anywhere<kbd class="wide">Ctrl K</kbd></div>
    <span class="me wide">Saved 2 &nbsp; Applied 1</span></header>
  <div class="cols">
    <aside class="rail wide">
      <h3>My experience</h3><ul><li>0 years <i>4</i></li><li>1 year <i>4</i></li><li>2 years <i>12</i></li><li class="on">3 years <i>33</i></li><li>4 years <i>41</i></li><li>5 or more <i>58</i></li></ul>
      <h3>Role</h3><ul><li class="on">AI/ML <i>24</i></li><li class="on">Backend <i>9</i></li><li>Mobile <i>3</i></li></ul>
      <h3>Where</h3><ul><li>India <i>19</i></li><li>Remote <i>6</i></li><li>Abroad with visa <i>8</i></li></ul>
    </aside>
    <div class="list">
      <div class="lhead"><span>33 jobs, newest first</span><span class="wide">white tick = your 3 years</span></div>
      <ol>${J.map(([t, c, w, p, a, b, n, sel]) => `<li class="${sel ? "sel" : ""}">
        <div style="min-width:0"><div class="t clip">${n ? '<span class="new"></span>' : ""}${t}</div><div class="s clip">${c}, ${w}, ${p}</div></div>
        <div><div class="rl"><span>${a === null ? "Not stated" : yrs(a, b) + " yrs"}</span><em class="${a === null ? "ns" : ""}">${a === null ? "?" : "fits"}</em></div>${ruler(a, b)}</div></li>`).join("")}</ol>
    </div>
    <section class="detail wide">
      <div class="co">Sarvam AI</div>
      <h2>ML Engineer (Data), Foundational Models</h2>
      <div class="facts">Bengaluru, onsite. Full-time. Posted 21 May.</div>
      <div class="big">${ruler(3, null)}<div class="scale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8+ years</span></div></div>
      <p class="verdict">Asks for 3 or more. You have 3. <b>It fits.</b></p>
      <div class="src">
        <div><span>13</span><span>What you bring</span></div>
        <div class="hit"><span>14</span><span>3+ years of experience building large-scale data systems</span></div>
        <div><span>15</span><span>Strong Python; Spark or Ray at petabyte scale</span></div>
        <p>Line 14 of the job description decided the label.</p>
      </div>
      <div class="acts"><button class="apply">Apply on Sarvam AI</button><button class="sec">Save<kbd>S</kbd></button><button class="sec">Check my fit<kbd>F</kbd></button></div>
    </section>
  </div></div>`;

const C = () => `<div class="c wrap">
  <header><span class="brand">Aventra</span>
    <nav class="wide"><span class="on">Jobs</span><span>Saved 2</span><span>Applied 1</span><span>Insights</span></nav>
    <span class="find">Search</span></header>
  <div class="dial"><span>I have</span><ol><li>0</li><li>1</li><li>2</li><li class="on">3</li><li>4</li><li>5+</li></ol><span class="wide">years</span></div>
  <p class="sub"><b>33 jobs</b> ask for 3 years or fewer. AI/ML and backend, anywhere.</p>
  <ol class="list">${J.map(([t, c, w, p, a, b, n, sel]) => `<li class="${sel ? "sel" : ""}">
    <span class="y ${a === null ? "ns" : ""}">${a === null ? "Years not stated" : yrs(a, b) + "<sup>yrs</sup>"}</span>
    <div><div class="t">${t}${n ? '<span class="new">New</span>' : ""}</div><div class="s narrow">${c}, ${w}</div></div>
    <span class="s wide">${c}<br>${w}</span><span class="when wide">${p}</span>
    ${sel ? `<div class="open"><div><blockquote>“<b>3+ years of experience</b> building large-scale data systems: petabyte-scale processing, distributed data pipelines, or comparable.”</blockquote><p>The line in the job description that decided 3+.</p></div>
      <div class="acts"><button class="apply">Apply on Sarvam AI</button><button class="sec">Save</button></div></div>` : ""}</li>`).join("")}</ol></div>`;

document.body.insertAdjacentHTML("afterbegin", { a: A, b: B, c: C }[d]());
</script>
</body>
</html>
