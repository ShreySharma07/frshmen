<!doctype html>
<!-- Kario job list, high-fidelity prototype (M4.5/M4.6 bridge). Shrey's spec, 2026-10-17:
     split-pane master-detail workspace: white canvas, near-black text, one Stripe-like purple accent
     (#5851EC, a shade darker than Stripe's #635BFF so small text passes WCAG AA).
     Static HTML + Tailwind (browser build) so it can be reviewed before the Next.js scaffold; the
     port will use motion/react (layoutId) where this uses one CSS-transformed indicator bar.
     All job content is real (data/local.db snapshot, 2026-10-06), built by a script; nothing is
     placeholder. Keys: j/k or arrows move, / search, a apply, s save, h hide.
     Add ?detail=1 on a phone width to see the detail sheet. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style type="text/tailwindcss">
  @theme {

}

  return `<li class="flex items-start gap-2 text-[13px] ${ok ? "text-white" : "text-zinc-400"}">
    ${ic(ok ? "check" : "minus", `!size-4 mt-0.5 ${ok ? "text-tint" : "text-zinc-500"}`)}
    <span>${text}${note ? `<span class="block text-[11px] text-zinc-400">${note}</span>` : ""}</span></li>`;
}

function renderInspector() {
  const j = visible()[active];
  if (!j) { $("#inspector").innerHTML = ""; return; }
  const y = label(j), ats = ATS[j.source] ?? j.source;
  const big = y == null ? `<div class="font-mono text-3xl font-semibold text-zinc-400">—</div><p class="mt-1 text-xs text-zinc-400">The posting doesn't state years of experience.</p>`
    : `<div class="font-mono text-3xl font-semibold tabular-nums text-tint">${y} <span class="text-lg">years</span></div>`;
  const quote = j.evidence ?? (newGrad(j) ? `“New Grad” in the title` : null);
  $("#inspector").innerHTML = `
    <button id="back" class="mb-4 inline-flex items-center gap-1 text-sm text-zinc-500 lg:hidden">${ic("back")}Jobs</button>
    <div class="flex items-center gap-3">
      ${logo(j, "size-11")}
      <div class="text-sm text-zinc-500"><span class="font-medium text-zinc-900">${esc(j.company)}</span> · via ${ats}</div>
    </div>
    <h1 class="mt-4 text-2xl font-medium leading-tight tracking-tight text-ink">${esc(j.title)}</h1>
    <div class="mt-3 flex flex-wrap gap-x-5 gap-y-1.5 text-[13px] text-zinc-500">
      <span class="inline-flex items-center gap-1.5">${ic("pin", "!size-3.5")}${esc(j.where)}${j.workplace ? ` · ${j.workplace[0].toUpperCase() + j.workplace.slice(1)}` : ""}</span>
      ${j.employment ? `<span class="inline-flex items-center gap-1.5">${ic("case", "!size-3.5")}${j.employment.replace("FullTime", "Full-time")}</span>` : ""}
      <span class="inline-flex items-center gap-1.5">${ic("clock", "!size-3.5")}Posted ${day(j.posted)}</span>
    </div>

    <div class="mt-5 grid gap-5 rounded-xl bg-ink p-5 text-white sm:grid-cols-[1fr_1fr]">
      <div>
        ${big}
        ${quote ? `<blockquote class="mt-3 border-l-2 border-tint/40 pl-3 text-xs italic leading-relaxed text-zinc-300">${esc(quote)}</blockquote>` : ""}
      </div>
      <ul class="space-y-2 sm:border-l sm:border-white/10 sm:pl-5">
        ${fitRow(true, `${FAMILY[j.family] ?? j.family} role`)}
        ${fitRow(true, esc(j.where) + (j.workplace ? ` · ${j.workplace[0].toUpperCase() + j.workplace.slice(1)}` : ""), "Matches “Anywhere”")}
        ${j.batch.length ? fitRow(true, `${j.batch.join(", ")} batch`) : fitRow(false, "Batch not stated")}
        ${j.early ? fitRow(true, "Early-career candidates considered") : ""}
        ${j.tech.length ? fitRow(true, `Mentions ${j.tech.slice(0, 4).join(", ")}`) : fitRow(false, "No tech stack named")}
        ${fitRow(j.visa === "yes", j.visa === "yes" ? "Visa sponsorship offered" : "Visa not mentioned")}
      </ul>
    </div>

    <div class="mt-5 flex flex-wrap items-center gap-2">
      <a href="${esc(j.url)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-lg bg-forest px-4 py-2.5 text-xs font-medium text-white transition-colors duration-150 hover:bg-forest-hover">Apply on ${esc(j.company)}${ic("out", "!size-3.5")}<kbd class="ml-1 hidden rounded border border-white/20 px-1 font-mono text-[10px] text-white/60 lg:inline">A</kbd></a>
      <button data-act="save" class="inline-flex items-center gap-1.5 rounded-lg border border-zinc-200 bg-white px-3 py-2.5 text-xs font-medium text-zinc-700 hover:bg-zinc-50">${ic("mark", `!size-3.5 ${saved.has(j.id) ? "fill-zinc-900" : ""}`)}${saved.has(j.id) ? "Saved" : "Save"}<kbd class="kbd ml-1 hidden lg:inline">S</kbd></button>
      <button data-act="hide" class="inline-flex items-center gap-1.5 rounded-lg border border-zinc-200 bg-white px-3 py-2.5 text-xs font-medium text-zinc-700 hover:bg-zinc-50">${ic("ban", "!size-3.5")}Hide<kbd class="kbd ml-1 hidden lg:inline">H</kbd></button>
    </div>

    <div class="mt-7 space-y-6 border-t border-zinc-200/70 pt-6 text-[13.5px] leading-relaxed text-zinc-700">
      ${j.req.length ? `<section><h2 class="mb-2 text-xs font-medium text-zinc-500">Requirements</h2>
        <ul class="list-disc space-y-1.5 pl-4 marker:text-zinc-300">${j.req.map(r => `<li>${highlight(r, j)}</li>`).join("")}</ul></section>` : ""}
      ${j.tech.length ? `<section><h2 class="mb-2 text-xs font-medium text-zinc-500">Tech stack signals</h2>
        <div class="flex flex-wrap gap-1.5">${j.tech.map(t => `<code class="kw">${t}</code>`).join("")}</div></section>` : ""}
      ${j.do.length ? `<section><h2 class="mb-2 text-xs font-medium text-zinc-500">Responsibilities</h2>
        <ul class="list-disc space-y-1.5 pl-4 marker:text-zinc-300">${j.do.map(r => `<li>${highlight(r, j)}</li>`).join("")}</ul></section>` : ""}
      <section class="rounded-lg border border-zinc-200/80 bg-row-active p-3.5">
        <h2 class="mb-2 inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500">${ic("db", "!size-3.5")}Source</h2>
        <dl class="grid grid-cols-[90px_1fr] gap-y-1 font-mono text-[11.5px]">
          <dt class="text-zinc-400">ATS</dt><dd class="text-zinc-800">${ats}</dd>
          <dt class="text-zinc-400">Job ID</dt><dd class="truncate text-zinc-800">${esc(j.id.split(":").pop())}</dd>
          <dt class="text-zinc-400">Posted</dt><dd class="text-zinc-800">${j.posted}</dd>
        </dl>
      </section>
    </div>`;
  $("#back")?.addEventListener("click", () => $("#inspector").classList.add("hidden"));
}

function select(i, open) {
  const n = visible().length;
  active = Math.max(0, Math.min(n - 1, i));
  renderList(); renderInspector();
  $(`#list [data-i="${active}"]`)?.scrollIntoView({ block: "nearest" });
  if (open && innerWidth < 1024) $("#inspector").classList.remove("hidden");
}

$("#list").addEventListener("click", e => { const li = e.target.closest("[data-i]"); if (li) select(+li.dataset.i, true); });
$("#inspector").addEventListener("click", e => act(e.target.closest("[data-act]")?.dataset.act));
function act(a) {
  const j = visible()[active]; if (!j || !a) return;
  if (a === "save") { saved.has(j.id) ? saved.delete(j.id) : saved.add(j.id); $("#saved-count").textContent = saved.size; }
  if (a === "hide") { hidden.add(j.id); active = Math.min(active, visible().length - 1); }
  if (a === "apply") window.open(j.url, "_blank", "noopener");
  renderList(); renderInspector();
}
addEventListener("keydown", e => {
  if (e.key === "Escape") toggleMenu(false);
  if (e.target.matches("input")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "j" || k === "ArrowDown") { e.preventDefault(); select(active + 1); }
  else if (k === "k" || k === "ArrowUp") { e.preventDefault(); select(active - 1); }
  else if (k === "/") { e.preventDefault(); $("#search").focus(); }
  else if (k === "a") act("apply"); else if (k === "s") act("save"); else if (k === "h") act("hide");
});
const meBtn = $("#me"), menu = $("#menu");
const toggleMenu = open => { menu.classList.toggle("hidden", !open); meBtn.setAttribute("aria-expanded", open); };
meBtn.addEventListener("click", e => { e.stopPropagation(); toggleMenu(menu.classList.contains("hidden")); });
addEventListener("click", e => { if (!menu.contains(e.target)) toggleMenu(false); });
addEventListener("resize", moveIndicator);
document.fonts.ready.then(moveIndicator);

renderList(); renderInspector();
const QS = new URLSearchParams(location.search);
if (QS.get("detail")) $("#inspector").classList.remove("hidden");
if (QS.get("menu")) toggleMenu(true);
</script>
</body>
</html>
