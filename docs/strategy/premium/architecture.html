body{margin:0;background:#fff;font:13px/1.35 system-ui,sans-serif;color:#1d1d1f}
.wrap{width:1400px;padding:20px 24px}
h1{font-size:20px;margin:0 0 2px} .sub{color:#666;margin:0 0 12px}

</style></head><body><div class="wrap">
<h1>Aventra Premium: how a subscription works</h1>
<p class="sub">Razorpay Subscriptions · ₹99 every month or ₹249 every 3 months · access is decided on our server, never in the browser</p>
<svg width="1350" height="760" viewBox="0 0 1350 760">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d1d1f"/></marker>
<marker id="arb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b5bdb"/></marker></defs>

<rect x="20" y="20" width="330" height="310" rx="10" class="box web"/>
<text x="38" y="48" class="t">Browser (site/, Next.js)</text>
<text x="38" y="76" class="it">• Locked screen on Agent, tailored</text><text x="50" y="92" class="it">resumes, extra fit checks: "Get Premium"</text>
<text x="38" y="116" class="it">• /premium: ₹99 a month or ₹249 / 3 months</text>
<text x="38" y="140" class="it">• checkout.js (Razorpay), loaded only</text><text x="50" y="156" class="it">on /premium; opens the payment sheet</text>
<text x="38" y="180" class="it">• Settings → Billing: plan, next charge,</text><text x="50" y="196" class="it">cancel (at the end of the period)</text>
<text x="38" y="220" class="it">• GET /api/billing/me decides what to</text><text x="50" y="236" class="it">show, never what is allowed</text>
<text x="38" y="266" class="it" fill="#a00">Holds no secret: the key ID only (public).</text>

<rect x="470" y="20" width="400" height="300" rx="10" class="box api"/>
<text x="488" y="48" class="t">API Worker (FastAPI on Cloudflare)</text>
<text x="488" y="74" class="it" font-weight="700">api/src/billing.py (new)</text>
<text x="488" y="96" class="it">POST /api/billing/subscribe  {plan}</text>
<text x="488" y="114" class="it">POST /api/billing/verify  {payment_id, sub_id, signature}</text>
<text x="488" y="132" class="it">POST /api/billing/webhook  (no login; signature only)</text>
<text x="488" y="150" class="it">POST /api/billing/cancel</text>
<text x="488" y="168" class="it">GET  /api/billing/me</text>
<text x="488" y="200" class="it" font-weight="700">Guard: require_premium(uid) on</text>
<text x="488" y="220" class="it">/api/agent/chat, /api/jobs/{id}/tailor, and</text>
<text x="488" y="238" class="it">/api/jobs/{id}/fit after the free 3 a day</text>
<text x="488" y="262" class="it">→ 402 "premium"; the page shows the lock</text>
<text x="488" y="296" class="it" fill="#666">Secrets and checks: box on the right ↘</text>

<rect x="1000" y="20" width="330" height="310" rx="10" class="box ext"/>
<text x="1018" y="48" class="t">Razorpay</text>
<text x="1018" y="76" class="it">• 2 Plans, made once in the dashboard:</text>
<text x="1030" y="92" class="it">₹99 every month · ₹249 every 3 months</text>
<text x="1018" y="116" class="it">• Subscriptions API: create, fetch, cancel</text>
<text x="1018" y="140" class="it">• Checkout: UPI Autopay mandate or card</text>
<text x="1018" y="164" class="it">• Charges each period itself, retries</text><text x="1030" y="180" class="it">failed charges, emails receipts</text>
<text x="1018" y="204" class="it">• Webhooks: authenticated, activated,</text>
<text x="1030" y="220" class="it">charged, pending, halted, cancelled,</text><text x="1030" y="236" class="it">completed</text>
<text x="1018" y="300" class="it">Fee ≈ 2% a payment. Test mode first.</text>

<rect x="1000" y="410" width="330" height="166" rx="10" class="box api"/>
<text x="1018" y="436" class="t">What the API checks itself</text>
<text x="1018" y="460" class="it">• HMAC of payment_id|sub_id (key secret)</text>
<text x="1018" y="480" class="it">• HMAC of the raw webhook body (webhook secret)</text>
<text x="1018" y="500" class="it">• each webhook event stored once (event id)</text>
<text x="1018" y="520" class="it">• re-reads the subscription from Razorpay;</text><text x="1030" y="536" class="it">never trusts what the browser says</text>
<text x="1018" y="562" class="it" fill="#666">Secrets: wrangler secret put, never in git</text>

<rect x="470" y="560" width="400" height="180" rx="10" class="box db"/>
<text x="488" y="588" class="t">Supabase Postgres (0018_billing.sql)</text>
<text x="488" y="614" class="it">subscriptions: student, razorpay id, plan, status,</text>
<text x="500" y="630" class="it">current_end, cancel_at_end (read own via RLS)</text>
<text x="488" y="652" class="it">billing_events: event id (unique), type, payload</text>
<text x="500" y="668" class="it">(API only; makes webhooks idempotent)</text>
<text x="488" y="690" class="it">premium_grants: you and beta users, set in /admin</text>
<text x="488" y="714" class="it" font-weight="700">is_premium(uid): one SQL function, used everywhere</text>

<rect x="1000" y="610" width="330" height="110" rx="10" class="box"/>
<text x="1018" y="638" class="t">Gemini</text>
<text x="1018" y="664" class="it">Called only after require_premium passes,</text>
<text x="1018" y="682" class="it">so free users can't run up the AI bill</text>

<rect x="20" y="410" width="400" height="330" rx="10" class="box"/>
<text x="38" y="438" class="t">Who counts as premium</text>
<text x="38" y="464" class="it">authenticated / active → yes</text>
<text x="38" y="484" class="it">pending (a renewal failed, Razorpay retrying)</text><text x="50" y="500" class="it">→ yes, until current_end + 3 days</text>
<text x="38" y="522" class="it">cancelled by the person → yes until current_end</text>
<text x="38" y="542" class="it">halted (retries used up) → no</text>
<text x="38" y="562" class="it">completed / expired → no</text>
<text x="38" y="582" class="it">a premium_grant that hasn't ended → yes</text>
<text x="38" y="614" class="it" font-weight="700">Free stays free</text>
<text x="38" y="634" class="it">Jobs, profile, Applications, Insights,</text>
<text x="38" y="652" class="it">3 fit checks a day</text>
<text x="38" y="682" class="it" font-weight="700">Premium adds</text>
<text x="38" y="702" class="it">Agent (chat, people, drafts, Gmail, LinkedIn),</text>
<text x="38" y="720" class="it">tailored resumes, more fit checks (daily cap)</text>

 <circle cx="409" cy="285" r="11" fill="#1d1d1f"/><text x="405" y="289" class="num">5</text><text x="362" y="310" class="lbl">verify signature</text>

 <circle cx="670" cy="470" r="11" fill="#1d1d1f"/><text x="666" y="474" class="num">7</text><text x="688" y="474" class="lbl">save status + current_end</text>
 <circle cx="940" cy="600" r="11" fill="#1d1d1f"/><text x="936" y="604" class="num">8</text><text x="930" y="548" class="lbl" text-anchor="end">only if premium</text>
</g>
