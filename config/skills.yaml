# Skills counted in postings (extract/skills.py) and looked for in a resume (the profile
# dashboard's "resume vs. the market"). One catalogue for both, so a tick means the same word.
#
# name:   what the dashboard shows
# terms:  words that count, matched as whole words (C++ and C# included)
# exact:  match the terms' case exactly; for names that are also English words ("Spark", "Ray")
#
# After editing, run `python scripts/export_skills.py` so the site's copy matches
# (tests/test_skills.py fails until it does).
skills:
  - {name: Python, terms: [Python]}
  - {name: PyTorch, terms: [PyTorch]}
