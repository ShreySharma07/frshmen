# Curated company list (target ~200 after pruning). See docs/decisions.md.
#
# Fields:
#   name      display name
#   category  lab | infra | applied | devtools | robotics | india | mnc | yc | community
#   hq        in | us | eu | uk | ca | global   (pruning hint only; job location is read per posting)
#   website   the company's site; scripts/detect_careers.py finds its careers system from it. A new
#             company can be added with only name/category/hq/website: detection fills ats and slug
#   ats       greenhouse | lever | ashby | workable | smartrecruiters   (guess until verified)
#             | workday | darwinbox | keka | zoho_recruit | amazon | eightfold | hn   (set by hand, never guessed)
#   india_only  true on big global boards: only India and remote roles are fetched
#   slug      board token on that ATS (guess until verified). Careers-site systems:
#             workday "tenant/wdN/site", darwinbox subdomain or full host, keka "sub[/portal-guid]",
#             zoho_recruit careers host (e.g. "acme.zohorecruit.in"), amazon country code ("IND"),
#             eightfold "host/domain" (e.g. "careers.qualcomm.com/qualcomm.com")
#   verified, jobs, ai_jobs   written by scripts/verify_companies.py; don't edit by hand
#
# Shrey: delete lines you don't want, add any you do. ats/slug can be left as a guess;
# the verifier tries every supported ATS and fixes them.

