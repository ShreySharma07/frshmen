name: Fetch smoke test

# Fetches one live board per ATS to catch payload changes the fixtures can't.
# Three small requests; the full fetch runs on a schedule in pipeline.yml.
on:
  pull_request:
    paths:
      - sources/**
      - scripts/fetch_jobs.py
      - .github/workflows/fetch-smoke.yml
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u scripts/fetch_jobs.py --no-cache --company "Hume AI" CRED Pinecone
      - name: Check every adapter produced jobs with text
        run: |
          python - <<'EOF'
          import json, collections
          jobs = json.load(open("data/jobs.json"))["jobs"]
          by_source = collections.Counter(j["source"] for j in jobs)
          print(dict(by_source))
          assert set(by_source) == {"greenhouse", "lever", "ashby"}, by_source
          empty = [j["id"] for j in jobs if not j["description_text"]]
          assert not empty, f"empty descriptions: {empty}"
          EOF

      # Careers-site systems (docs/decisions.md): one known board each, called through the adapters.
      - name: Check careers-site adapters live
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from sources import ADAPTERS
          from sources.http import FetchError, HttpClient
          from sources.models import Company

          from sources import amazon, careersite, eightfold, oracle, smartrecruiters, workday
          # Keep the smoke test small: a few pages and details per board are enough to see the shapes.
          amazon.MAX_PAGES = eightfold.MAX_PAGES = 1
          oracle.MAX_PAGES = 2
          eightfold.MAX_DETAILS = workday.MAX_DETAILS = careersite.MAX_DETAILS = oracle.MAX_DETAILS = 5
          smartrecruiters.MAX_PAGES, smartrecruiters.MAX_DETAILS = 1, 5

          http = HttpClient()
          failed = []
          for name, ats, slug in [
              ("BrowserStack", "workday", "browserstack/wd3/External"),
              # Darwinbox answers 403 to GitHub's runners (docs/decisions.md), so it isn't checked here.
              ("Jupiter", "keka", "jupiter/b5279857-cf81-4dde-a215-fc48957ee2b5"),
              ("Wadhwani AI", "zoho_recruit", "wadhwaniai.zohorecruit.in"),
              ("NVIDIA", "workday", "nvidia/wd5/NVIDIAExternalCareerSite"),  # sitemap stops at 100; search must page
              ("Amazon", "amazon", "IND"),
              ("HN Who is hiring", "hn", "whoishiring"),
              ("NetApp", "eightfold", "netapp.eightfold.ai/netapp.com"),  # v2 tenant
              ("Qualcomm", "eightfold", "careers.qualcomm.com/qualcomm.com"),  # PCSX tenant
              ("EY", "careersite", "careers.ey.com"),  # SuccessFactors: sitemap + microdata
              ("KPMG India", "oracle", "ejgk.fa.em2.oraclecloud.com/CX_1"),
              ("Writesonic", "workable", "writesonic"),
              ("Swiggy", "smartrecruiters", "swiggy"),
          ]:
              try:
                  titles = ADAPTERS[ats].list_titles(http, slug)
                  company = Company(name, ats, slug, india_only=True)
                  jobs = ADAPTERS[ats].fetch(http, company) if titles else []
                  if ats == "oracle" and titles and not jobs:
                      # The newest few pages may hold no title the role screen keeps (KPMG: audit, SFDC);
                      # the detail call is what needs proving, so fetch the newest job's text directly.
                      first = oracle.requisitions(http, slug, 1)[0]
                      job = oracle.parse_detail(http.get_json(oracle.detail_url(slug, first["Id"])), company, first)
                      jobs = [job] if job else []
                  if ats == "smartrecruiters" and titles and not jobs:
                      # Same reason: Swiggy's newest 100 are mostly operations roles.
                      first = smartrecruiters.postings(http, slug, 1)[0]
                      job = smartrecruiters.parse_detail(http.get_json(smartrecruiters.detail_url(slug, first["id"])), company)
                      jobs = [job] if job else []
              except FetchError as e:
                  # One blocked host shouldn't hide whether the other adapters work.
                  print(f"{ats} {slug}: FAILED {e}")
                  failed.append(ats)
                  continue
              print(f"{ats} {slug}: {len(titles or [])} listed, {len(jobs)} fetched")
              for j in jobs[:2]:
                  print(f"  {j.title} | {j.location_raw} | {j.posted_at} | {j.description_text[:120]!r}")
              # Every fetched job must carry text, or the YoE rules have nothing to check.
              if titles is None or (titles and not jobs) or any(not j.description_text for j in jobs):
                  failed.append(ats)
          # Workday search: the India facet must be found and must page past the sitemap's 100.
          first = http.post_json(workday.search_url("nvidia/wd5/NVIDIAExternalCareerSite"), workday._search_body(0, {}))
          india = workday.india_facet((first or {}).get("facets") or [])
          india_postings = workday.search(http, "nvidia/wd5/NVIDIAExternalCareerSite", india_only=True, max_pages=10)
          print("workday search: total", (first or {}).get("total"), "india facet", india,
                "india postings (10 pages max)", None if india_postings is None else len(india_postings))
          if india is None or not india_postings:
              failed.append("workday-search")
          assert not failed, f"adapters returned nothing: {failed}"
          EOF
