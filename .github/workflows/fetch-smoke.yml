name: Fetch smoke test

# Fetches one live board per ATS to catch payload changes the fixtures can't.
# Three small requests; the full fetch runs on a schedule in pipeline.yml.
on:
  pull_request:
    paths:
      - sources/**
      - scripts/fetch_jobs.py
      - .github/workflows/fetch-smoke.yml
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u scripts/fetch_jobs.py --no-cache --company "Hume AI" CRED Pinecone
      - name: Check every adapter produced jobs with text
        run: |
          python - <<'EOF'
          import json, collections
          jobs = json.load(open("data/jobs.json"))["jobs"]
          by_source = collections.Counter(j["source"] for j in jobs)
          print(dict(by_source))
          assert set(by_source) == {"greenhouse", "lever", "ashby"}, by_source
          empty = [j["id"] for j in jobs if not j["description_text"]]
          assert not empty, f"empty descriptions: {empty}"
          EOF

      # Careers-site systems (docs/decisions.md): one known board each, called through the adapters.
      - name: Check careers-site adapters live
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from sources import ADAPTERS
          from sources.http import FetchError, HttpClient
          from sources.models import Company

          http = HttpClient()
          failed = []
          for name, ats, slug in [
              ("BrowserStack", "workday", "browserstack/wd3/External"),
              ("Spinny", "darwinbox", "spinzone"),
              ("Jupiter", "keka", "jupiter"),
              ("Wadhwani AI", "zoho_recruit", "wadhwaniai.zohorecruit.in"),
          ]:
              try:
                  titles = ADAPTERS[ats].list_titles(http, slug)
                  jobs = ADAPTERS[ats].fetch(http, Company(name, ats, slug)) if titles else []
              except FetchError as e:
                  # One blocked host shouldn't hide whether the other adapters work.
                  print(f"{ats} {slug}: FAILED {e}")
                  failed.append(ats)
                  continue
              print(f"{ats} {slug}: {len(titles or [])} listed, {len(jobs)} fetched")
              for j in jobs[:2]:
                  print(f"  {j.title} | {j.location_raw} | {j.posted_at} | {j.description_text[:120]!r}")
              if titles is None or (titles and not jobs and ats in ("keka", "zoho_recruit")):
                  failed.append(ats)
              if ats == "zoho_recruit" and titles is None:
                  page = http.get_text(f"https://{slug}/jobs/Careers") or ""
                  i = page.find('id="jobs"')
                  print("  zoho page length", len(page), "jobs input at", i, repr(page[max(0, i - 200):i + 300]))
          # Field-name check for the two adapters built from documentation rather than a live sample.
          from sources import keka, zoho_recruit
          raw = zoho_recruit.embedded_jobs(http.get_text("https://wadhwaniai.zohorecruit.in/jobs/Careers")) or [{}]
          print("zoho keys:", sorted(raw[0]))
          print("zoho sample:", {k: str(v)[:80] for k, v in raw[0].items()})
          guid = keka.portal_guid(http, "jupiter")
          print("keka guid:", guid)
          if guid:
              data = http.get_json(keka.list_url("jupiter", guid))
              print("keka list:", type(data).__name__, len(data) if isinstance(data, list) else str(data)[:300])
          page = http.get_text("https://jupiter.keka.com/careers/") or ""
          for marker in ("embedjobs", "identifier", "khConfig"):
              i = page.find(marker)
              print(f"keka page {marker!r} at {i}:", repr(page[max(0, i - 80):i + 160]) if i >= 0 else "")
          assert not failed, f"adapters returned nothing: {failed}"
          EOF
