name: Fetch and publish jobs

# fetch -> classify -> publish changed rows to D1, every 3 hours (docs/decisions.md).
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; GEMINI_API_KEY is optional.
on:
  schedule:
    # Minute 17, not 0: GitHub delays on-the-hour cron runs the most.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # keep-alive step below

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      # Keeps ETag / Last-Modified validators between runs so unchanged boards cost hosts ~nothing.
      - uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      # Gemini verdicts per posting (content_hash), so each job costs one request ever.
      - uses: actions/cache@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ github.run_id }}
          restore-keys: llm-cache-

      - name: Fetch and classify
        run: python -u scripts/fetch_jobs.py

      # Second opinion on `maybe` jobs (docs/decisions.md). Without the secret it only
      # re-applies cached verdicts, and the rules' labels stand.
      - name: LLM review of maybe jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/llm_review.py

      - name: Publish to D1
        run: python -u scripts/publish_d1.py --d1 frshmen

      # GitHub disables scheduled workflows after 60 days without repo activity;
      # re-enabling through the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"

      - name: Run summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          p = pathlib.Path("data/jobs.json")
          if not p.exists():
              print("No jobs.json produced."); raise SystemExit
          d = json.loads(p.read_text())
          jobs = d["jobs"]
          t = [j for j in jobs if j["role_match"]]
          lv = collections.Counter(j["level"] for j in t)
          print(f"**{len(jobs)} jobs** from {len(d['boards_ok'])} boards ({len(d['errors'])} failed). "
                f"Target roles: {len(t)} — fresher {lv['fresher']}, maybe {lv['maybe']}, experienced {lv['experienced']}.")
          for name, err in d["errors"].items():
              print(f"- {name}: {err}")
          EOF
