name: Fetch and publish jobs

# fetch -> classify -> publish changed rows to Supabase, every 3 hours (docs/decisions.md).
# Needs SUPABASE_DB_URL.
on:
  schedule:
    # Minute 17, not 0: GitHub delays on-the-hour cron runs the most.
    # Every 3 hours; the 03:17 UTC run (08:47 IST) is the daily one that also reads the big global
    # boards (india_only), the others skip them (docs/decisions.md, 2026-10-19).
    - cron: "17 3 * * *"
    - cron: "17 0,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # keep-alive step below

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps ETag / Last-Modified validators between runs so unchanged boards cost hosts ~nothing.
      - uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Fetch and classify
        # A manual run reads everything, like the daily one.
        run: python -u scripts/fetch_jobs.py ${{ github.event.schedule == '17 0,6,9,12,15,18,21 * * *' && '--skip-global' || '' }}

      - name: Publish to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u scripts/publish_pg.py

      # GitHub disables scheduled workflows after 60 days without repo activity;
      # re-enabling through the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"

      - name: Run summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          p = pathlib.Path("data/jobs.json")
          if not p.exists():
              print("No jobs.json produced."); raise SystemExit
          d = json.loads(p.read_text())
          jobs = d["jobs"]
          t = [j for j in jobs if j["role_match"]]
          lv = collections.Counter(j["level"] for j in t)
          print(f"**{len(jobs)} jobs** from {len(d['boards_ok'])} boards ({len(d['errors'])} failed). "
                f"Target roles: {len(t)} — fresher {lv['fresher']}, maybe {lv['maybe']}, experienced {lv['experienced']}.")
          for name, err in d["errors"].items():
              print(f"- {name}: {err}")
          EOF
