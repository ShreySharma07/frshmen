name: Deploy site

# Builds the Next.js site (static export) and deploys it with the FastAPI Worker (one Worker,
# Static Assets).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - api/**
      - site/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Sign-in (src/lib/supabase.ts). Both are public by design and end up in the page's JS, so
          # a repo variable is the natural home; a repo secret of the same name works too.
          # Unset, /login and /profile say sign-in isn't switched on yet.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        # Fail loudly instead of shipping a site whose sign-in is silently off.
        # (Remove this guard if sign-in should ever be deliberately off.)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is missing. Add both under Settings > Secrets and variables > Actions (Variables or Secrets tab, repository level)."
            exit 1
          fi
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v6

      - name: Deploy Worker
        working-directory: api
        env:
          # The API checks sign-ins with Supabase (api/src/auth.py) and runs fit checks with Gemini
          # (api/src/fit.py, on through FIT_CHECK in wrangler.jsonc).
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run pywrangler deploy --var "SUPABASE_URL:$SUPABASE_URL" --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"
          # A Worker secret, never a var: copied from the repo secret on each deploy so a new Worker
          # (like the rename to aventra) gets it without a manual step.
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler secret put GEMINI_API_KEY
          fi
