name: Deploy site

# Builds the React page and deploys it with the FastAPI Worker (one Worker, Static Assets).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - api/**
      - web/**
      - db/migrations/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build page
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Apply database migrations
        working-directory: api
        run: npx --yes wrangler@4 d1 migrations apply frshmen --remote

      - uses: astral-sh/setup-uv@v6

      - name: Deploy Worker
        working-directory: api
        run: uv run pywrangler deploy
