name: Measure storage

# Read-only: what the database holds and what one job costs, printed on the run's summary page
# (docs/strategy/worldwide-coverage.md, phase 0). Run it by hand before and after storage changes.
# Daily it also fails past 80% of the free 500 MB, so GitHub emails the repo owner
# (docs/decisions.md, 2026-11-18, security review M3).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"  # 05:23 UTC daily, off the pipeline's :17 runs

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Measure
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u scripts/measure_storage.py --alert
