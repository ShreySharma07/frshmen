name: Copy D1 to Supabase

# One-off M3 copy of every job from D1 into Supabase Postgres (docs/plan.md §13). Safe to run
# again: it upserts and skips unchanged rows. Shares the pipeline's concurrency group, so it
# never runs while the pipeline is writing D1 and the final count check stays exact.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and SUPABASE_DB_URL.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and check only, write nothing"
        type: boolean
        default: true

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Copy
        run: python -u scripts/migrate_d1_to_pg.py ${{ inputs.dry_run && '--dry-run' || '' }}
